name: CertWatch Daily Check

on:
  schedule:
    # Runs once a day at 13:00 UTC (about 7am Central Time / 8am Eastern).
    # Cron format is: minute hour day month weekday
    - cron: '0 13 * * *'
  workflow_dispatch:
    # This adds a manual "Run workflow" button on GitHub, so you can
    # trigger a check by hand anytime, without waiting for the schedule.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHOIS_API_KEY: ${{ secrets.WHOIS_API_KEY }}
        run: node check.js
