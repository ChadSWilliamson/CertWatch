name: CertWatch Daily Check

on:
  schedule:
    # Runs once a day at 13:00 UTC (about 7am Central Time / 8am Eastern).
    # Cron format is: minute hour day month weekday
    - cron: '0 13 * * *'
  workflow_dispatch:
    # This adds a manual "Run workflow" button on GitHub, so you can
    # trigger a check by hand anytime, without waiting for the schedule.

permissions:
  contents: write
  # Needed so the workflow can save alert-state.json back to the
  # repo after each run — that's the "notebook" that remembers
  # which alerts have already been sent.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHOIS_API_KEY: ${{ secrets.WHOIS_API_KEY }}
        run: node check.js

      - name: Save alert memory back to the repo
        run: |
          git config user.name "CertWatch Bot"
          git config user.email "actions@github.com"
          git add alert-state.json
          git diff --staged --quiet || git commit -m "Update alert state"
          git push
