name: CertWatch Daily Check

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # No longer needs write access — alert state now lives in
  # Supabase, not in a file committed back to this repo.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run the checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHOIS_API_KEY: ${{ secrets.WHOIS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node check.js
